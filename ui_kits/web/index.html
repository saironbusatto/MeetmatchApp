<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farmei — Web app</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-page); height: 100%; }
  body { font-family: var(--font-body); color: var(--fg-1); }
  #root, .app { height: 100vh; }
  ::selection { background: var(--spark-300); color: var(--ink-900); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>

  <script type="text/babel">
    function App() {
      const [view, setView] = React.useState('upcoming'); // upcoming/waiting/inbox use Dashboard
      const isCalendar = view === 'calendar';
      const title = isCalendar ? 'Calendar' : (view === 'waiting' ? 'Waiting on you' : 'Your events');
      const subtitle = isCalendar ? 'June 2026 · Crew' : 'Buenas, Sofia — 2 events need your attention';
      const [segment, setSegment] = React.useState('Month');

      return (
        <div className="app" style={{ display: 'flex', height: '100vh' }} data-screen-label="Web app">
          <Sidebar active={view} onChange={setView}/>
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            <TopBar title={title} subtitle={subtitle} segment={isCalendar ? segment : undefined} onSegment={setSegment}/>
            {isCalendar ? <CalendarView/> : <DashboardView/>}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
