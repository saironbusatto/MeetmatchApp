<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 28px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:14px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;border:1px solid rgba(0,0,0,0.06);}
  .sw .name{font:600 12px/1 var(--font-body);color:var(--ink-900);}
  .sw .hex{font:var(--t-mono);font-size:11px;color:var(--ink-700);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#FFFBE8;"><div class="name">50</div><div class="hex">#FFFBE8</div></div>
    <div class="sw" style="background:#FFF4BD;"><div class="name">100</div><div class="hex">#FFF4BD</div></div>
    <div class="sw" style="background:#FFE980;"><div class="name">200</div><div class="hex">#FFE980</div></div>
    <div class="sw" style="background:#FFD93D;outline:2px solid var(--ink-900);outline-offset:-2px;"><div class="name">300 ★</div><div class="hex">#FFD93D</div></div>
    <div class="sw" style="background:#F5C400;"><div class="name">400</div><div class="hex">#F5C400</div></div>
    <div class="sw" style="background:#C99B00;"><div class="name" style="color:#fff;">500</div><div class="hex" style="color:#fff;">#C99B00</div></div>
  </div>
  <div style="margin-top:14px;font:var(--t-caption);color:var(--fg-3);">★ Used <em>only</em> for AI-thinking states, suggested-date highlights, and the logomark spark dot. 1–3% of pixels max.</div>
</body></html>
