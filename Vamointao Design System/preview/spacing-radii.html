<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 28px;display:flex;gap:18px;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:80px;height:80px;background:var(--ink-900);border:2px solid var(--vermillion-500);}
  .name{font:var(--t-mono);font-size:11px;color:var(--fg-3);}
  .val{font:600 12px/1 var(--font-body);color:var(--fg-1);}
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:6px;"></div><div class="val">--r-xs</div><div class="name">6px</div></div>
  <div class="item"><div class="box" style="border-radius:10px;"></div><div class="val">--r-sm</div><div class="name">10px</div></div>
  <div class="item"><div class="box" style="border-radius:14px;"></div><div class="val">--r-md</div><div class="name">14px</div></div>
  <div class="item"><div class="box" style="border-radius:20px;"></div><div class="val">--r-lg ★</div><div class="name">20px</div></div>
  <div class="item"><div class="box" style="border-radius:28px;"></div><div class="val">--r-xl</div><div class="name">28px</div></div>
  <div class="item"><div class="box" style="border-radius:36px;"></div><div class="val">--r-2xl</div><div class="name">36px</div></div>
  <div class="item"><div class="box" style="border-radius:999px;"></div><div class="val">--r-pill</div><div class="name">pill</div></div>
</body></html>
