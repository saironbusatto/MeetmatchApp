<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 28px;}
  table{border-collapse:collapse;width:100%;}
  td{padding:6px 0;vertical-align:baseline;}
  td.token{font:var(--t-mono);color:var(--fg-3);width:110px;}
  td.spec{font:var(--t-mono);color:var(--fg-3);width:130px;}
  td.sample{font-family:var(--font-display);color:var(--fg-1);letter-spacing:-0.025em;line-height:1.05;}
</style></head>
<body>
  <table>
    <tr><td class="token">display-1</td><td class="spec">700 / 96</td><td class="sample" style="font-size:42px;font-weight:700;">Vamos.</td></tr>
    <tr><td class="token">h1</td><td class="spec">700 / 56</td><td class="sample" style="font-size:30px;font-weight:700;">Find a time.</td></tr>
    <tr><td class="token">h3</td><td class="spec">600 / 28</td><td class="sample" style="font-size:22px;font-weight:600;">Section heading</td></tr>
    <tr><td class="token">lead</td><td class="spec">500 / 20</td><td class="sample" style="font-size:18px;font-weight:500;font-family:var(--font-body);letter-spacing:0;color:var(--fg-2);">Supporting paragraph</td></tr>
    <tr><td class="token">body</td><td class="spec">400 / 16</td><td class="sample" style="font-size:15px;font-weight:400;font-family:var(--font-body);letter-spacing:0;">Default reading size</td></tr>
    <tr><td class="token">caption</td><td class="spec">500 / 12</td><td class="sample" style="font-size:12px;font-weight:500;font-family:var(--font-body);letter-spacing:0;color:var(--fg-3);">5 of 6 responded</td></tr>
    <tr><td class="token">eyebrow</td><td class="spec">600 / 12 · UC</td><td class="sample" style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;font-family:var(--font-body);color:var(--fg-2);">Eyebrow label</td></tr>
  </table>
</body></html>
