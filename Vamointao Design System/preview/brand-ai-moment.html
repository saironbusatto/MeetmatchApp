<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  html, body { margin: 0; background: var(--bg-page); overflow: hidden; }
  body {
    font-family: var(--font-body);
    color: var(--fg-1);
    padding: 26px 30px;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    position: relative;
  }

  /* warm paper glow underneath */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 30%, rgba(255, 59, 46, 0.06), transparent 45%),
      radial-gradient(circle at 82% 70%, rgba(255, 217, 61, 0.10), transparent 45%);
    pointer-events: none;
  }

  /* ── the card ─────────────────────────────────────── */
  .ai-card {
    flex: 1;
    background: var(--bg-spark-soft);
    border: 2px solid var(--ink-900);
    border-radius: var(--r-lg);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--stamp);
    transform: rotate(-1.2deg);
    animation: cardFloat 4.5s ease-in-out infinite;
  }
  @keyframes cardFloat {
    0%, 100% { transform: rotate(-1.2deg) translateY(0); }
    50%      { transform: rotate(-1.2deg) translateY(-3px); }
  }

  /* shimmer sweep — the AI is "thinking → landed" */
  .ai-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg,
      transparent 30%,
      rgba(255, 217, 61, 0.65) 50%,
      transparent 70%);
    transform: translateX(-110%);
    animation: shim 2.6s ease-in-out infinite;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  @keyframes shim {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(110%); }
  }

  /* ── sparkle pin ──────────────────────────────────── */
  .sparkle-pin {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--spark-300);
    border: 2px solid var(--ink-900);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    box-shadow: 2px 2px 0 var(--ink-900);
  }
  .sparkle-pin > i {
    font-size: 30px;
    color: var(--ink-900);
    display: inline-flex;
    animation: spin 3.4s linear infinite;
  }
  @keyframes spin {
    0%   { transform: rotate(0deg)   scale(1); }
    50%  { transform: rotate(180deg) scale(1.12); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .micro-spark {
    position: absolute;
    color: var(--spark-500);
    filter: drop-shadow(0 0 0.5px var(--ink-900));
  }
  .micro-spark.a { top: -8px; right: -6px; animation: pop 1.8s ease-in-out infinite; }
  .micro-spark.b { bottom: -4px; left: -6px; animation: pop 1.8s ease-in-out infinite 600ms; }
  .micro-spark i { font-size: 14px; }
  @keyframes pop {
    0%, 100% { transform: scale(0.6) rotate(0);    opacity: 0.4; }
    50%      { transform: scale(1.1) rotate(20deg); opacity: 1; }
  }

  /* ── middle copy ──────────────────────────────────── */
  .content { flex: 1; min-width: 0; position: relative; z-index: 1; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 700 9.5px/1 var(--font-mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-700);
    margin-bottom: 5px;
  }
  .eyebrow .brand-tag {
    width: 18px;
    height: 18px;
    flex: none;
  }
  .eyebrow .live-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--vermillion-500);
    animation: pulse 1.2s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(255, 59, 46, 0.18);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.45; }
  }

  .headline {
    font: 700 23px/1.04 var(--font-display);
    letter-spacing: -0.025em;
    color: var(--ink-900);
    margin: 0 0 6px 0;
    animation: headIn 600ms var(--ease-spring) both 120ms;
  }
  @keyframes headIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .detail {
    font: 500 13px/1.3 var(--font-body);
    color: var(--ink-800);
    margin: 0;
  }
  .date-stamp {
    font: 700 12.5px/1 var(--font-mono);
    background: var(--ink-900);
    color: var(--spark-300);
    padding: 4px 7px 3px;
    border-radius: var(--r-xs);
    letter-spacing: 0.02em;
    display: inline-block;
    transform-origin: center;
    animation: stampIn 700ms var(--ease-spring) both 320ms;
  }
  @keyframes stampIn {
    0%   { transform: scale(0.4) rotate(-10deg); opacity: 0; }
    60%  { transform: scale(1.1) rotate( 3deg); }
    100% { transform: scale(1)   rotate(-1.5deg); opacity: 1; }
  }
  .count { font-weight: 700; color: var(--ink-900); }

  /* ── crew avatars ─────────────────────────────────── */
  .crew {
    flex: none;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 1;
    padding-left: 4px;
  }
  .av {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--bg-spark-soft);
    margin-left: -9px;
    font: 700 11px/1 var(--font-body);
    color: var(--ink-900);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 1.5px 1.5px 0 var(--ink-900);
    animation: avIn 500ms var(--ease-spring) both;
  }
  .av:first-child { margin-left: 0; }
  .av:nth-child(1) { animation-delay:  60ms; background: #FFD2B8; }
  .av:nth-child(2) { animation-delay: 140ms; background: #BFE4D4; }
  .av:nth-child(3) { animation-delay: 220ms; background: #C9D8FF; }
  .av:nth-child(4) {
    animation-delay: 320ms;
    background: var(--vermillion-500);
    color: #fff;
    border-color: var(--ink-900);
    transform: scale(1.12);
    z-index: 2;
    box-shadow: 2px 2px 0 var(--ink-900);
  }
  .av:nth-child(4)::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1.5px dashed var(--vermillion-500);
    opacity: 0.55;
    animation: ringSpin 6s linear infinite;
  }
  .av:nth-child(4) {
    position: relative;
    animation: avIn 500ms var(--ease-spring) both, keyBob 2.4s ease-in-out 500ms infinite;
  }
  @keyframes avIn {
    from { transform: scale(0) translateY(6px); opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes keyBob {
    0%, 100% { transform: scale(1.12) translateY(0); }
    50%      { transform: scale(1.18) translateY(-2px); }
  }
  @keyframes ringSpin {
    to { transform: rotate(360deg); }
  }

  /* tiny heart popping over key avatar */
  .crew-meta {
    position: relative;
    margin-left: 8px;
    font: 700 10px/1 var(--font-mono);
    color: var(--ink-700);
    letter-spacing: 0.04em;
    text-align: center;
    text-transform: uppercase;
  }
  .crew-meta b {
    display: block;
    font: 700 16px/1 var(--font-display);
    color: var(--ink-900);
    letter-spacing: -0.02em;
    margin-bottom: 2px;
  }

  /* responsive: hide crew-meta if very narrow */
  @media (max-width: 520px) {
    .headline { font-size: 19px; }
    .crew-meta { display: none; }
    .av { width: 28px; height: 28px; }
  }
</style></head>
<body>

  <div class="ai-card" role="status" aria-label="Farmei IA achou uma data">

    <!-- sparkle pin -->
    <div class="sparkle-pin">
      <i class="ph-fill ph-sparkle"></i>
      <span class="micro-spark a"><i class="ph-fill ph-sparkle"></i></span>
      <span class="micro-spark b"><i class="ph-fill ph-sparkle"></i></span>
    </div>

    <!-- copy -->
    <div class="content">
      <div class="eyebrow">
        <img class="brand-tag" src="../assets/logomark.svg" alt="">
        <span>Farmei IA · achou</span>
        <span class="live-dot" aria-hidden="true"></span>
      </div>
      <h3 class="headline">Bora terça? 🙌</h3>
      <p class="detail">
        <span class="date-stamp">ter, 4 jun</span>
        rola pra <span class="count">5 de 6</span> da galera
      </p>
    </div>

    <!-- crew + count -->
    <div class="crew">
      <div class="av" title="Mari">M</div>
      <div class="av" title="Ana">A</div>
      <div class="av" title="Fê">F</div>
      <div class="av" title="Diego — key person">D</div>
    </div>

  </div>

</body></html>
