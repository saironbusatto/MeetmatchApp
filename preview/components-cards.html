<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:20px;display:flex;gap:16px;justify-content:center;align-items:center;}
  .card{background:var(--bg-surface);border:1px solid var(--border-1);border-radius:20px;padding:18px 20px;width:280px;box-shadow:0 2px 6px rgba(10,10,10,0.04);}
  .card .title{font:600 18px/1.2 var(--font-display);letter-spacing:-0.01em;color:var(--fg-1);}
  .card .meta{font:var(--t-mono);font-size:11px;color:var(--fg-3);margin-top:4px;}
  .card .footer{display:flex;justify-content:space-between;margin-top:14px;align-items:center;}
  .stack{display:flex;}
  .av{width:26px;height:26px;border-radius:50%;border:2px solid #fff;font:700 10px/1 var(--font-body);display:flex;align-items:center;justify-content:center;color:#fff;margin-left:-8px;}
  .av:first-child{margin-left:0;}
  .badge{font:600 11px/1 var(--font-body);padding:5px 9px;background:var(--success-100);color:var(--success-500);border-radius:6px;text-transform:uppercase;letter-spacing:0.05em;}
  /* Stamped card variant */
  .stamp{background:var(--bg-surface);border:2px solid var(--ink-900);box-shadow:3px 3px 0 var(--ink-900);}
</style></head>
<body>
  <div class="card">
    <div class="meta">TUE · JUN 04 · 14:00</div>
    <div class="title" style="margin-top:6px;">Q3 planning lunch</div>
    <div class="footer">
      <div class="stack">
        <div class="av" style="background:#FF3B2E;">D</div>
        <div class="av" style="background:#2A6F7A;">M</div>
        <div class="av" style="background:#7A5BAA;">JR</div>
      </div>
      <span class="badge">locked in</span>
    </div>
  </div>
  <div class="card stamp">
    <div class="meta">PENDING · 5 of 6 responded</div>
    <div class="title" style="margin-top:6px;">Birthday drinks for Sofia</div>
    <div class="footer">
      <div class="stack">
        <div class="av" style="background:#C99B00;">S</div>
        <div class="av" style="background:#2A6F7A;">M</div>
        <div class="av" style="background:#FF3B2E;">D</div>
        <div class="av" style="background:#3F3E3A;">+3</div>
      </div>
      <span class="badge" style="background:var(--warn-100);color:#9D6B0C;">waiting</span>
    </div>
  </div>
</body></html>
