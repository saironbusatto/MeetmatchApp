<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 28px;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .name{font:var(--t-mono);font-size:11px;color:var(--fg-3);width:64px;}
  .bar{background:var(--vermillion-500);height:18px;border-radius:4px;}
  .px{font:var(--t-mono);font-size:11px;color:var(--fg-1);margin-left:8px;}
</style></head>
<body>
  <div class="row"><span class="name">s-1</span><div class="bar" style="width:4px;"></div><span class="px">4</span></div>
  <div class="row"><span class="name">s-2</span><div class="bar" style="width:8px;"></div><span class="px">8</span></div>
  <div class="row"><span class="name">s-3</span><div class="bar" style="width:12px;"></div><span class="px">12</span></div>
  <div class="row"><span class="name">s-4</span><div class="bar" style="width:16px;"></div><span class="px">16</span></div>
  <div class="row"><span class="name">s-6</span><div class="bar" style="width:24px;"></div><span class="px">24</span></div>
  <div class="row"><span class="name">s-8</span><div class="bar" style="width:32px;"></div><span class="px">32</span></div>
  <div class="row"><span class="name">s-12</span><div class="bar" style="width:48px;"></div><span class="px">48</span></div>
  <div class="row"><span class="name">s-16</span><div class="bar" style="width:64px;"></div><span class="px">64</span></div>
  <div class="row"><span class="name">s-24</span><div class="bar" style="width:96px;"></div><span class="px">96</span></div>
</body></html>
