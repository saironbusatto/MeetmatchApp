<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 30px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
  .card{background:var(--spark-100);border:2px solid var(--ink-900);border-radius:20px;padding:18px 20px;box-shadow:3px 3px 0 var(--ink-900);width:380px;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,0.6) 50%,transparent 60%);transform:translateX(-100%);animation:shimmer 2.4s var(--ease-out) infinite;pointer-events:none;}
  @keyframes shimmer{0%{transform:translateX(-100%);}60%,100%{transform:translateX(100%);}}
  .eyebrow{font:600 11px/1 var(--font-body);letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-900);display:flex;align-items:center;gap:6px;}
  .date{font:700 36px/1 var(--font-display);letter-spacing:-0.025em;color:var(--ink-900);margin-top:10px;}
  .time{font:600 16px/1 var(--font-mono);color:var(--ink-700);margin-top:6px;}
  .meta{display:flex;gap:14px;margin-top:14px;align-items:center;}
  .stat{font:var(--t-mono);font-size:12px;color:var(--ink-700);}
  .stat b{color:var(--ink-900);font-weight:600;}
  .lock{position:relative;z-index:1;margin-top:14px;font:600 14px/1 var(--font-body);padding:12px 16px;border-radius:10px;background:var(--ink-900);color:var(--spark-300);border:none;box-shadow:2px 2px 0 var(--vermillion-500);cursor:pointer;}
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">✦ AI suggestion</div>
    <div class="date">Tuesday, Jun 4</div>
    <div class="time">14:00 — 15:30</div>
    <div class="meta">
      <span class="stat"><b>5 of 6</b> available</span>
      <span class="stat">Conf <b>0.92</b></span>
    </div>
    <button class="lock">Lock it in →</button>
  </div>
</body></html>
