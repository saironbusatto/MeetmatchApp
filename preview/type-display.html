<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:28px 32px;}
  .specimen{display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .meta{font:var(--t-mono);color:var(--fg-3);min-width:170px;}
  .sample{font-family:var(--font-display);letter-spacing:-0.035em;color:var(--fg-1);}
</style></head>
<body>
  <div class="specimen">
    <div class="row"><span class="meta">Display / 700 · 96</span></div>
    <div class="sample" style="font-weight:700;font-size:96px;line-height:0.92;">Vamos.</div>
    <div class="row" style="margin-top:8px;"><span class="meta">H1 / 700 · 56</span></div>
    <div class="sample" style="font-weight:700;font-size:56px;line-height:1.02;letter-spacing:-0.025em;">Find a time that works.</div>
    <div class="row" style="margin-top:6px;"><span class="meta">H3 / 600 · 28</span></div>
    <div class="sample" style="font-weight:600;font-size:28px;line-height:1.16;letter-spacing:-0.015em;">Bricolage Grotesque · the display face</div>
  </div>
</body></html>
