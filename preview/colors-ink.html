<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 28px;}
  .row{display:flex;gap:8px;}
  .sw{flex:1;border-radius:12px;height:80px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border:1px solid rgba(0,0,0,0.08);}
  .sw .name{font:600 11px/1 var(--font-body);}
  .sw .hex{font:var(--t-mono);font-size:10px;margin-top:2px;opacity:0.8;}
  .dark{color:#fff;}
  .light{color:var(--ink-900);}
</style></head>
<body>
  <div class="row">
    <div class="sw light" style="background:#FFFFFF;"><div class="name">0 · white</div><div class="hex">#FFFFFF</div></div>
    <div class="sw light" style="background:#FAFAF7;"><div class="name">25 · paper</div><div class="hex">#FAFAF7</div></div>
    <div class="sw light" style="background:#F4F2EC;"><div class="name">50</div><div class="hex">#F4F2EC</div></div>
    <div class="sw light" style="background:#E8E6E0;"><div class="name">100 · border</div><div class="hex">#E8E6E0</div></div>
    <div class="sw light" style="background:#D4D1C8;"><div class="name">200</div><div class="hex">#D4D1C8</div></div>
    <div class="sw light" style="background:#B8B4A8;"><div class="name">300</div><div class="hex">#B8B4A8</div></div>
  </div>
  <div class="row" style="margin-top:8px;">
    <div class="sw light" style="background:#8C8A82;"><div class="name">400</div><div class="hex">#8C8A82</div></div>
    <div class="sw dark" style="background:#5F5D57;"><div class="name">500</div><div class="hex">#5F5D57</div></div>
    <div class="sw dark" style="background:#3F3E3A;"><div class="name">600</div><div class="hex">#3F3E3A</div></div>
    <div class="sw dark" style="background:#28272A;"><div class="name">700</div><div class="hex">#28272A</div></div>
    <div class="sw dark" style="background:#161618;"><div class="name">800</div><div class="hex">#161618</div></div>
    <div class="sw dark" style="background:#0A0A0A;"><div class="name">900 · ink</div><div class="hex">#0A0A0A</div></div>
  </div>
</body></html>
