<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 28px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tok{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bg-surface);border:1px solid var(--border-1);border-radius:12px;}
  .chip{width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);flex:none;}
  .name{font:600 13px/1.1 var(--font-body);color:var(--fg-1);}
  .desc{font:var(--t-mono);font-size:11px;color:var(--fg-3);margin-top:2px;}
</style></head>
<body>
  <div class="tok"><div class="chip" style="background:#FF3B2E;"></div><div><div class="name">--fg-brand</div><div class="desc">Vermillion 600 · primary CTA</div></div></div>
  <div class="tok"><div class="chip" style="background:#FFD93D;"></div><div><div class="name">--bg-spark</div><div class="desc">Spark 300 · AI moments only</div></div></div>
  <div class="tok"><div class="chip" style="background:#FAFAF7;"></div><div><div class="name">--bg-page</div><div class="desc">Paper · primary canvas</div></div></div>
  <div class="tok"><div class="chip" style="background:#FFFFFF;"></div><div><div class="name">--bg-surface</div><div class="desc">Card / panel</div></div></div>
  <div class="tok"><div class="chip" style="background:#0A0A0A;"></div><div><div class="name">--fg-1</div><div class="desc">Primary text</div></div></div>
  <div class="tok"><div class="chip" style="background:#5F5D57;"></div><div><div class="name">--fg-2</div><div class="desc">Secondary text</div></div></div>
  <div class="tok"><div class="chip" style="background:#8C8A82;"></div><div><div class="name">--fg-3</div><div class="desc">Tertiary · metadata</div></div></div>
  <div class="tok"><div class="chip" style="background:#E8E6E0;"></div><div><div class="name">--border-1</div><div class="desc">Hairline border</div></div></div>
  <div class="tok"><div class="chip" style="background:#2EA862;"></div><div><div class="name">--success-500</div><div class="desc">Confirmed states</div></div></div>
  <div class="tok"><div class="chip" style="background:#E89E18;"></div><div><div class="name">--warn-500</div><div class="desc">Conflict / heads-up</div></div></div>
</body></html>
