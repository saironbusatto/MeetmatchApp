<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:24px 30px;display:flex;gap:18px;align-items:center;}
  .ai-card{flex:1;background:var(--ink-900);color:#fff;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;}
  .ai-card::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,217,61,0.18) 50%,transparent 65%);transform:translateX(-100%);animation:shim 1.6s var(--ease-out) infinite;}
  @keyframes shim{0%{transform:translateX(-100%);}60%,100%{transform:translateX(100%);}}
  .spark{width:36px;height:36px;border-radius:50%;background:var(--spark-300);color:var(--ink-900);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex:none;position:relative;z-index:1;}
  .label{font:600 11px/1 var(--font-body);letter-spacing:0.12em;text-transform:uppercase;color:var(--spark-300);position:relative;z-index:1;}
  .msg{font:500 15px/1.3 var(--font-body);color:#fff;margin-top:4px;position:relative;z-index:1;}
  .dots{display:inline-flex;gap:3px;margin-left:6px;}
  .dots span{width:5px;height:5px;border-radius:50%;background:var(--spark-300);animation:b 1.2s infinite ease-in-out;}
  .dots span:nth-child(2){animation-delay:0.15s;}
  .dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes b{0%,80%,100%{transform:scale(0.6);opacity:0.5;}40%{transform:scale(1);opacity:1;}}
</style></head>
<body>
  <div class="ai-card">
    <div class="spark">✦</div>
    <div>
      <div class="label">Farmei AI</div>
      <div class="msg">Hunting for a time that works for everyone<span class="dots"><span></span><span></span><span></span></span></div>
    </div>
  </div>
</body></html>
