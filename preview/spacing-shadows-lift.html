<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:32px;display:flex;gap:30px;align-items:center;justify-content:center;}
  .card{width:130px;height:84px;background:var(--bg-surface);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--fg-3);font:var(--t-mono);font-size:11px;}
  .xs{box-shadow:0 1px 2px rgba(10,10,10,0.04);}
  .sm{box-shadow:0 2px 6px rgba(10,10,10,0.06);}
  .md{box-shadow:0 6px 18px rgba(10,10,10,0.08);}
  .lg{box-shadow:0 16px 40px rgba(10,10,10,0.10);}
</style></head>
<body>
  <div class="card xs">--shadow-xs</div>
  <div class="card sm">--shadow-sm</div>
  <div class="card md">--shadow-md</div>
  <div class="card lg">--shadow-lg</div>
</body></html>
