<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);}
  body{font-family:var(--font-body);color:var(--fg-1);padding:28px 32px;display:flex;gap:36px;align-items:center;}
  .meta{font:var(--t-mono);color:var(--fg-3);margin-bottom:8px;}
  .big{font:600 56px/1 var(--font-mono);letter-spacing:-0.02em;color:var(--fg-1);}
  .row{font:var(--t-mono);color:var(--fg-1);}
  .row span{color:var(--fg-3);margin-right:8px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--vermillion-500);vertical-align:middle;margin:0 6px;}
</style></head>
<body>
  <div>
    <div class="meta">JetBrains Mono · 600</div>
    <div class="big">14:00–15:30</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div class="row"><span>DATE</span>Tue, Jun 4</div>
    <div class="row"><span>WHO</span>5 of 6<span class="dot"></span>Diego out</div>
    <div class="row"><span>CONF</span>0.92</div>
    <div class="row"><span>WINDOW</span>Jun 03 → Jun 14</div>
  </div>
</body></html>
